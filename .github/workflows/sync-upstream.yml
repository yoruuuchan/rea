name: Sync upstream

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream without replacing fork workflows
        env:
          UPSTREAM_REPO: morluto/rea
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date."
            exit 0
          fi

          git merge --no-commit --no-ff upstream/main || true

          # Keep this fork's workflow directory exactly as it was before the merge.
          # Removing it from the merge index first also resolves modify/delete
          # conflicts when upstream changes workflows that this fork deleted.
          git rm -r -f --ignore-unmatch .github/workflows
          git checkout HEAD -- .github/workflows
          git add -A

          if git ls-files -u | grep -q .; then
            echo "Unresolved merge conflicts remain outside .github/workflows."
            git status --short
            exit 1
          fi

          git commit --allow-empty -m "chore: sync upstream"
          git push origin HEAD:main
